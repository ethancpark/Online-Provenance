name: Monthly email digest

# Sends the opt-in monthly digest on the 1st of each month. The work happens in
# the app (it already has the Supabase client and the templates); this workflow
# only pulls the trigger, so the schedule lives next to the scan schedule
# rather than in a second place.
#
# Required repository secrets:
#   CRON_SECRET  — must match the same secret in the Vercel environment
#   SITE_URL     — e.g. https://onlineprovenance.vercel.app
on:
  schedule:
    - cron: "0 14 1 * *" # 1st of the month, 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and report without sending"
        type: boolean
        default: true

concurrency:
  group: monthly-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DRY: ${{ inputs.dry_run && '?dry=1' || '' }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "::error::CRON_SECRET and SITE_URL repository secrets are required."
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/monthly-email$DRY")
          echo "HTTP $code"
          cat response.json
          echo
          # 207 means some recipients failed; surface it without losing the report.
          [ "$code" = "200" ] || { echo "::error::digest run returned $code"; exit 1; }
